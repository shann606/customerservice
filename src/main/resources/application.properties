spring.application.name=customerservice

server.port=8081

# oracle database connetion

spring.jpa.hibernate.ddl-auto=none


#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect


# Show SQL in logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Oracle JDBC URL:
# Use the thin driver, specify hostname, port, and service name (or SID)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/orcl 

# Database username
spring.datasource.username=localbank

# Database password

spring.datasource.password=local123

# Driver class name (for Oracle)
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

logging.level.root=INFO
logging.level.com.ecom.customerservice=DEBUG


# calling inner microservices

online.recommproducts=/api/v1/products/recommendation/

 management.tracing.enabled=true
 management.tracing.sampling.probability=1.0
 logging.level.io.micrometer=DEBUG
 
 #spring.zipkin.enabled=true
 logging.level.io.zipkin=DEBUG
 
  management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
 #spring.zipkin.base-url=http://localhost:9411/api/v2/spans         
 #spring.zipkin.sender.type=web               
 logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] 
 logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} ${LOG_LEVEL_PATTERN} %logger{36} - %msg%n
 logging.include-application-name=false
 

management.endpoints.web.exposure.include=health,info,prometheus



# encrypt key details
crypto.secret-key=


spring.cloud.openfeign.circuitbreaker.enabled=true

resilience4j.circuitbreaker.instances.productservice.slidingWindowSize=2
resilience4j.circuitbreaker.instances.productservice.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.productservice.failureRateThreshold=2
resilience4j.circuitbreaker.instances.productservice.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.productservice.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.productservice.recordExceptions=\
feign.FeignException,\
java.net.ConnectException,\
java.net.SocketTimeoutException


resilience4j.retry.instances.productservice.maxAttempts=2
resilience4j.retry.instances.productservice.waitDuration=2s


#logging.level.io.github.resilience4j.circuitbreaker=DEBUG
#logging.level.org.springframework.cloud.openfeign=DEBUG